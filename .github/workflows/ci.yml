name: Static site checks

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Test
        run: |
          node tests/smoke.mjs
